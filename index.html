<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7ec8ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Hop Quest</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0e1630; font-family:-apple-system,Segoe UI,Roboto,sans-serif; touch-action:none; }
  #game { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#0e1630; touch-action:none; }
  canvas { image-rendering:pixelated; max-width:100%; max-height:100%; box-shadow:0 0 40px rgba(0,0,0,.6); }

  .btn { border:none; border-radius:50%; color:#fff; font-size:30px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 12px rgba(0,0,0,.45); }
  .pad { position:fixed; bottom:26px; z-index:20; opacity:.92; touch-action:none; }
  #left  { left:24px;  width:74px; height:74px; background:rgba(255,255,255,.16); }
  #right { left:110px; width:74px; height:74px; background:rgba(255,255,255,.16); }
  #jump  { right:24px;  width:96px; height:96px; background:radial-gradient(circle at 40% 35%,#a8ff9c,#3fbf5a); }
  #act   { right:132px; width:74px; height:74px; bottom:40px; background:radial-gradient(circle at 40% 35%,#ffd77a,#f0a93a); font-size:24px; }
  .btn:active { filter:brightness(1.2); transform:scale(.95); }

  .overlay { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    text-align:center; color:#fff; background:rgba(10,16,40,.9); backdrop-filter:blur(6px); padding:16px 16px 90px; overflow-y:auto;
    touch-action:pan-y; -webkit-overflow-scrolling:touch; }
  #overScreen { justify-content:center; padding-bottom:16px; }
  .overlay.hidden { display:none; }
  .title { font-size:clamp(36px,10vw,68px); font-weight:900; letter-spacing:1px; color:#ffd54a; text-shadow:0 4px 0 #c98a00,0 6px 16px rgba(0,0,0,.5); }
  .sub { font-size:clamp(13px,3.6vw,19px); color:#bcd6f0; margin:2px 0 10px; }
  .card { background:rgba(255,255,255,.06); border-radius:16px; padding:10px 14px; margin:6px 0; width:min(440px,92vw); }
  .lbl { font-size:14px; color:#9fb6d4; margin-bottom:6px; text-align:left; }
  .row { display:flex; flex-wrap:wrap; gap:9px; justify-content:center; }
  .sw { width:34px; height:34px; border-radius:50%; border:3px solid transparent; box-shadow:0 2px 5px rgba(0,0,0,.4); }
  .sw.sel { border-color:#fff; transform:scale(1.15); }
  .chip { padding:8px 13px; border-radius:20px; border:2px solid rgba(255,255,255,.22); background:rgba(255,255,255,.05); color:#cfe6ff; font-size:14px; }
  .chip.sel { border-color:#ffd54a; background:rgba(255,213,74,.16); color:#fff; }
  .abil { display:flex; align-items:center; gap:10px; padding:7px 12px; border-radius:12px; border:2px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.05); margin:4px 0; cursor:pointer; text-align:left; }
  .abil.sel { border-color:#7ee08a; background:rgba(126,224,138,.14); }
  .abil.dis { opacity:.4; }
  .abil .ic { font-size:24px; width:30px; text-align:center; }
  .abil .nm { font-weight:700; color:#fff; font-size:15px; }
  .abil .de { font-size:12px; color:#9fb6d4; }
  .budget { font-size:15px; color:#ffd54a; font-weight:700; margin:6px 0; }
  .play { margin-top:10px; padding:15px 52px; font-size:26px; font-weight:800; color:#06243a; border:none; border-radius:36px;
    background:linear-gradient(180deg,#a8ff9c,#3fbf5a); box-shadow:0 6px 18px rgba(0,0,0,.45); cursor:pointer; }
  .play:active { transform:translateY(2px); }
  .rush { background:linear-gradient(180deg,#e0a8ff,#9a4ae0); color:#2a0a3a; font-size:19px; padding:11px 36px; margin-top:8px; }
  .big { font-size:clamp(40px,13vw,84px); font-weight:900; }
  .win { color:#7ee08a; } .lose { color:#ff7a7a; }
  #hud { position:fixed; top:12px; left:14px; z-index:30; color:#fff; font-size:20px; font-weight:800;
    text-shadow:0 2px 4px rgba(0,0,0,.6); display:flex; gap:16px; align-items:center; }
  #menuBtn { position:fixed; top:12px; right:14px; z-index:30; height:40px; padding:0 14px; border:none; border-radius:20px;
    background:rgba(255,255,255,.14); color:#fff; font-size:14px; font-weight:700; }
  #musBtn { position:fixed; top:12px; right:112px; z-index:30; height:40px; width:44px; border:none; border-radius:20px;
    background:rgba(255,255,255,.14); font-size:18px; }
  #ver { position:fixed; bottom:6px; right:9px; z-index:60; font-size:11px; color:rgba(255,255,255,.3); }
  #victoryScreen { justify-content:center; padding-bottom:16px; overflow:hidden; }
  .vic-title { font-size:clamp(42px,12vw,84px); font-weight:900; letter-spacing:2px; color:#ffd54a;
    text-shadow:0 0 26px rgba(255,213,74,.65),0 4px 0 #c98a00,0 6px 16px rgba(0,0,0,.5);
    animation:vicPulse 1.1s ease-in-out infinite alternate; }
  @keyframes vicPulse { from{transform:scale(1)} to{transform:scale(1.07)} }
  .confetti { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .cp { position:absolute; top:-24px; border-radius:2px; opacity:.9; animation:cfall linear infinite; }
  @keyframes cfall { to { transform:translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
<div id="game"><canvas id="cv"></canvas></div>

<div id="hud"></div>
<button id="menuBtn">≡ Menu</button>
<button id="musBtn">🎵</button>
<div id="ver"></div>

<button class="btn pad" id="left">◀</button>
<button class="btn pad" id="right">▶</button>
<button class="btn pad" id="jump">▲</button>
<button class="btn pad" id="act">✦</button>

<div class="overlay" id="startScreen">
  <div class="title">HOP QUEST</div>
  <div class="sub">Build your hero · pick your powers · run &amp; jump!</div>

  <div class="card">
    <div class="lbl">Level — pick where to start</div>
    <div class="row" id="levels"></div>
  </div>
  <div class="card">
    <div class="lbl">Color</div>
    <div class="row" id="colors"></div>
  </div>
  <div class="card">
    <div class="lbl">Hat</div>
    <div class="row" id="hats"></div>
  </div>
  <div class="card">
    <div class="lbl">Abilities — pick up to <b>3</b></div>
    <div class="budget" id="budget"></div>
    <div id="abilities"></div>
  </div>
  <div class="card">
    <div class="lbl">Sound</div>
    <div class="row">
      <button class="chip" id="musTog">🎵 Music: ON</button>
      <button class="chip" id="sfxTog">🔊 Sound FX: ON</button>
    </div>
  </div>

  <button class="play" id="playBtn">PLAY ▶</button>
  <button class="play rush" id="rushBtn">👑 BOSS RUSH</button>
  <div class="sub" style="margin-top:10px">Move: ◀ ▶ / arrows · Jump: ▲ / Space · Power: ✦ / Shift</div>
</div>

<div class="overlay hidden" id="victoryScreen">
  <div class="confetti" id="confetti"></div>
  <div style="font-size:64px">🏆</div>
  <div class="vic-title">VICTORY!</div>
  <div class="sub" id="vicSub" style="margin-top:8px"></div>
  <div style="font-size:32px;margin:8px 0">👑 🍄 ⭐ 🛡️ ❤️</div>
  <button class="play" id="vicAgain">↺ PLAY AGAIN</button>
  <button class="chip" id="vicMenu" style="margin-top:14px">← Menu / change hero</button>
</div>

<div class="overlay hidden" id="overScreen">
  <div class="big" id="resultText">LEVEL CLEAR!</div>
  <div class="sub" id="resultSub"></div>
  <button class="play" id="nextBtn">NEXT LEVEL ▶</button>
  <button class="chip" id="againBtn" style="margin-top:12px">↺ Replay level</button>
  <button class="chip" id="overMenu" style="margin-top:12px">← Menu / change hero</button>
</div>

<script>
const APP_VERSION='v16';
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const VW=880, VH=520, TILE=40;
cv.width=VW; cv.height=VH;

// ---------- customization ----------
const COLORS=['#ff6b6b','#ff9d3a','#ffd54a','#5fe08a','#46c8ff','#7c8cff','#c77dff','#ff7ad1'];
const HATS=[{id:'none',ic:'∅',nm:'None'},{id:'cap',ic:'🧢',nm:'Cap'},{id:'crown',ic:'👑',nm:'Crown'},{id:'party',ic:'🎉',nm:'Party'},{id:'horn',ic:'🦄',nm:'Horn'},
  {id:'wiz',ic:'🧙',nm:'Wizard',lock:()=>totalGems()>=15,hint:'15 💎'},
  {id:'astro',ic:'🚀',nm:'Astronaut',lock:()=>goldCount()>=5,hint:'5 🥇'},
  {id:'pirate',ic:'🏴‍☠️',nm:'Pirate',lock:()=>rushBest()>=11,hint:'Rush 11 👑'}];
function hatOpen(h){ return !h.lock || h.lock(); }
const ABILITIES=[
  {id:'double', ic:'🪽', nm:'Double Jump', de:'Jump again in mid-air', cost:1},
  {id:'dash',   ic:'💨', nm:'Dash',        de:'Burst forward (✦ button)', cost:1},
  {id:'glide',  ic:'🪂', nm:'Glide',       de:'Hold jump to fall slowly', cost:1},
  {id:'highjump',ic:'⤴️',nm:'High Jump',   de:'Jump noticeably higher', cost:1},
  {id:'pound',  ic:'⬇️', nm:'Ground Pound', de:'Press ✦ in air to slam down', cost:1},
  {id:'magnet', ic:'🧲', nm:'Coin Magnet',  de:'Nearby coins fly to you', cost:1},
  {id:'heart',  ic:'❤️', nm:'Extra Heart',  de:'Start with +1 heart', cost:1},
];
const BUDGET=3;
let sel={ color:COLORS[3], hat:'cap', abil:new Set(['double']) };
let menuLevel=0;
try{ const s=JSON.parse(localStorage.getItem('hopHero')||'null'); if(s){ sel.color=s.color||sel.color; sel.hat=s.hat||sel.hat; sel.abil=new Set(s.abil||['double']); if(typeof s.level==='number') menuLevel=s.level; } }catch(e){}
function saveHero(){ try{ localStorage.setItem('hopHero', JSON.stringify({color:sel.color,hat:sel.hat,abil:[...sel.abil],level:menuLevel})); }catch(e){} }
function has(a){ return sel.abil.has(a); }

// ---------- levels ----------
// 22 hand-built worlds, each with its own layout AND art theme.
let W, H, grid, coins, enemies, spikes, projectiles, boxes, presents, toasts, boss, flag, startPx, curTheme, curName, curLevel=0;
let springs, movers, gems, checkpoint, wonder;          // auto-placed per level
let wonderT=0, wonderFx=null, gMul=1;                   // wonder-flower effect state
let rushMode=false, rushIdx=0, rushT=0, rushAdv=false;  // 👑 boss rush state
let pet=null;                                           // 🐣 buddy: follows, grabs coins, blocks one hit
let doorA=null, doorB=null, warpT=0, warpCd=0;          // 🚪 warp door + coin vault
let levelT=0;                                           // ⏱ time attack clock
let timeStore={};                                       // best times per level
try{ timeStore=JSON.parse(localStorage.getItem('hopTimes')||'{}')||{}; }catch(e){}
function saveTimes(){ try{ localStorage.setItem('hopTimes', JSON.stringify(timeStore)); }catch(e){} }
function medalFor(i,t){ const w=LEVELS[i].W; return t<=w*0.35?'🥇':t<=w*0.55?'🥈':t<=w*0.9?'🥉':''; }
function fmtT(t){ return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'); }
function totalGems(){ let n=0; for(const k in gemStore) n+=(gemStore[k]||[]).filter(Boolean).length; return n; }
function goldCount(){ let n=0; for(const k in timeStore) if(medalFor(+k,timeStore[k])==='🥇') n++; return n; }
let gemStore={};                                        // 💎 collection, persisted per level
try{ gemStore=JSON.parse(localStorage.getItem('hopGems')||'{}')||{}; }catch(e){}
function saveGems(){ try{ localStorage.setItem('hopGems', JSON.stringify(gemStore)); }catch(e){} }

const LEVELS=[
  { name:'Sunny Meadow', W:190, music:'cheery', boss:{nm:'MEADOW BLOB', col:'#5a9c3a', hp:3, shots:0},
    theme:{ sky:['#7ec8ff','#cfeaff'], hillA:'#a9d98a', hillB:'#8fc96f', dirt:'#7a4a24', cap:'#5cbf46', platA:'#c98a3a', platB:'#8a5a22', spike:'#c9d0da' },
    build(L){
      L.ground([[24,26],[43,45],[70,72],[95,97],[120,122],[145,147],[168,170]]);
      L.plat(8,7,4); L.plat(15,5,3); L.plat(30,8,4); L.plat(34,5,5); L.plat(48,7,6); L.plat(58,4,3);
      L.plat(64,8,4); L.plat(78,6,5); L.plat(88,8,3); L.plat(100,6,4); L.plat(108,4,4); L.plat(114,8,4);
      L.plat(128,7,4); L.plat(136,5,4); L.plat(150,7,4); L.plat(158,5,3); L.plat(172,6,4); L.plat(180,8,4);
      L.coin(9,6,3); L.coin(15,4,3); L.coin(20,9,3); L.coin(35,4,4); L.coin(49,6,5); L.coin(58,3,3);
      L.coin(65,7,3); L.coin(79,5,4); L.coin(90,9,3); L.coin(101,5,3); L.coin(108,3,4); L.coin(115,7,3);
      L.coin(40,9,3); L.coin(52,9,4); L.coin(128,6,4); L.coin(137,4,3); L.coin(151,6,4); L.coin(173,5,3); L.coin(181,7,3);
      [12,20,33,50,66,80,102,110,130,155,175].forEach(x=>L.en(x));
      L.jump(60); L.jump(140); L.jump(165);
      L.spk(38,2); L.spk(62,2); L.spk(85,2); L.spk(125,2); L.spk(160,2);
      // sky route (climb from the x≈15 platforms)
      L.plat(20,3,3); L.plat(26,1,3); L.plat(32,-1,3); L.plat(38,-3,4); L.plat(46,-4,5); L.plat(54,-3,4); L.plat(62,-4,5); L.plat(70,-3,4); L.plat(78,-4,5); L.plat(86,-3,4);
      L.coin(46,-6,5); L.coin(62,-6,5); L.coin(78,-6,5); L.coin(32,-3,3);
      L.fly(50,-1); L.fly(74,-1);
      L.box(9,6); L.box(65,7); L.box(118,9); L.box(151,6);
    } },
  { name:'Crystal Cavern', W:180, music:'cave', boss:{nm:'CRYSTAL GOLEM', col:'#7a6ac0', hp:3, shots:0},
    theme:{ sky:['#241a3a','#3a2c55'], hillA:'#2e2450', hillB:'#241b40', dirt:'#4a4358', cap:'#8f7fc0', platA:'#7a6aa0', platB:'#4a4066', spike:'#b8c4e0' },
    build(L){
      L.ground([[28,29],[52,53],[78,79],[104,105],[130,131],[156,157]]);
      L.ceiling();
      L.plat(9,8,3); L.plat(15,6,3); L.plat(21,8,3); L.plat(27,7,2); L.plat(34,5,4); L.plat(42,7,3);
      L.plat(48,5,3); L.plat(54,7,2); L.plat(60,8,3); L.plat(66,6,4); L.plat(74,7,2); L.plat(80,8,3);
      L.plat(86,6,4); L.plat(94,5,3); L.plat(100,7,3); L.plat(106,5,4);
      L.plat(114,7,3); L.plat(122,5,4); L.plat(132,7,3); L.plat(140,5,4); L.plat(150,7,3); L.plat(160,6,4); L.plat(168,4,4);
      L.coin(10,7,3); L.coin(16,5,3); L.coin(35,4,4); L.coin(48,4,3); L.coin(67,5,3); L.coin(87,5,3);
      L.coin(95,4,3); L.coin(107,4,3); L.coin(22,7,3); L.coin(61,7,3);
      L.coin(114,6,3); L.coin(123,4,4); L.coin(141,4,4); L.coin(160,5,4); L.coin(168,3,4);
      [12,20,38,46,64,72,90,98,108,126,144,162].forEach(x=>L.en(x));
      L.shoot(56); L.shoot(100); L.shoot(150);
      L.spk(44,2); L.spk(70,2); L.spk(110,2); L.spk(146,2);
      // upper cavern route (below the raised ceiling)
      L.plat(20,4,3); L.plat(26,2,3); L.plat(32,0,3); L.plat(38,-2,4); L.plat(46,-3,5); L.plat(54,-2,4); L.plat(62,-3,5); L.plat(70,-2,4);
      L.coin(46,-5,5); L.coin(62,-5,5); L.coin(38,-4,4);
      L.fly(50,0); L.fly(66,0);
      L.box(10,7); L.box(61,7); L.box(133,6);
    } },
  { name:'Sky Islands', W:180, cloudy:true, music:'breezy', boss:{nm:'SKY PUFF', col:'#e08ab0', hp:3, shots:0, hop:60},
    theme:{ sky:['#bfe6ff','#e9f6ff'], hillA:null, hillB:null, dirt:'#7a4a24', cap:'#5cbf46', platA:'#c98a3a', platB:'#8a5a22', spike:'#c9d0da' },
    startX:2, startTop:10, flagX:170, flagTop:9,
    build(L){
      const isl=[[1,10,4],[7,9,3],[12,9,3],[17,8,3],[22,9,3],[27,8,3],[32,9,3],[37,8,3],[42,9,3],[47,8,3],
        [52,9,3],[57,8,3],[62,9,3],[67,8,3],[72,9,3],[77,8,3],[82,9,3],[87,8,3],[92,9,3],[97,8,3],[102,9,3],[107,8,3],
        [112,9,3],[117,8,3],[122,9,3],[127,8,3],[132,9,3],[137,8,3],[142,9,3],[147,8,3],[152,9,3],[157,8,3],[162,9,3],[168,9,5]];
      isl.forEach(([x,y,w])=>L.island(x,y,w));
      [[9,8],[19,7],[29,7],[39,7],[49,7],[59,7],[69,7],[79,7],[89,7],[99,7],[109,7],[119,7],[129,7],[139,7],[149,7],[159,7]].forEach(([x,y])=>L.coin(x,y,3));
      L.coin(35,4,3); L.coin(65,4,3); L.coin(95,4,3); L.coin(125,4,3); L.coin(155,4,3);   // high-reward (double-jump)
      L.en(22,8); L.en(62,8); L.en(102,8); L.en(142,8);
      L.fly(15); L.fly(40); L.fly(75); L.fly(110); L.fly(135); L.fly(158);
      // sky route above the islands
      L.island(16,5,3); L.island(21,3,3); L.island(26,1,3); L.island(31,-1,3); L.island(38,-2,4); L.island(46,-3,4); L.island(54,-2,4); L.island(62,-3,4); L.island(70,-2,4); L.island(78,-3,4); L.island(86,-2,4);
      L.coin(46,-5,4); L.coin(62,-5,4); L.coin(78,-5,4); L.coin(31,-3,3);
      L.fly(50,-1); L.fly(74,0);
      L.box(8,8); L.box(53,8); L.box(108,7);
    } },
  { name:'Lava Ruins', W:185, music:'danger', boss:{nm:'LAVA LORD', col:'#d04a20', hp:3, shots:1, x:182},
    theme:{ sky:['#3a1414','#6e2a1a'], hillA:'#3a1e14', hillB:'#2a1410', dirt:'#3a2a2a', cap:'#5a3a2a', platA:'#7a4a2a', platB:'#4a2a1a', spike:'#e0b0a0', hazard:'#ff5a1e' },
    build(L){
      L.ground([[19,21],[35,37],[51,53],[67,69],[83,85],[99,101],[113,115],[129,131],[145,147],[161,163],[177,179]]);
      L.plat(24,6,3); L.plat(40,5,3); L.plat(56,6,3); L.plat(72,5,3); L.plat(88,6,3); L.plat(104,5,3);
      L.plat(120,6,3); L.plat(136,5,3); L.plat(152,6,3); L.plat(168,5,3);
      L.coin(24,5,3); L.coin(40,4,3); L.coin(56,5,3); L.coin(72,4,3); L.coin(88,5,3); L.coin(104,4,3);
      L.coin(8,9,4); L.coin(46,9,3); L.coin(78,9,3); L.coin(120,5,3); L.coin(136,4,3); L.coin(152,5,3); L.coin(168,4,3);
      [10,30,46,62,78,94,110].forEach(x=>L.en(x));
      L.chase(44); L.chase(92); L.chase(140); L.chase(170);
      L.spk(27,2); L.spk(43,2); L.spk(59,3); L.spk(75,2); L.spk(91,3); L.spk(107,2); L.spk(123,2); L.spk(139,3); L.spk(155,2); L.spk(171,2);
      // sky route above the lava
      L.plat(30,4,3); L.plat(36,2,3); L.plat(42,0,3); L.plat(48,-2,4); L.plat(56,-3,5); L.plat(64,-2,4); L.plat(72,-3,5); L.plat(80,-2,4);
      L.coin(56,-5,5); L.coin(72,-5,5); L.coin(48,-4,4);
      L.fly(60,0); L.fly(76,0);
      L.box(25,5); L.box(89,5); L.box(153,5);

const SKY=8;  // rows of climbable sky above every level; build() coords stay in the
              // original 13-row space (negative y = sky), the api shifts them down
function buildLevel(idx){
  curLevel=((idx%LEVELS.length)+LEVELS.length)%LEVELS.length;
  const def=LEVELS[curLevel]; curTheme=def.theme; curName=def.name;
  H=13+SKY; W=def.W; grid=Array.from({length:H},()=>new Array(W).fill(0));
  coins=[]; enemies=[]; spikes=[]; projectiles=[]; boxes=[]; presents=[]; toasts=[];
  springs=[]; movers=[]; gems=[]; checkpoint=null; wonder=null; wonderT=0; wonderFx=null; gMul=1;
  doorA=null; doorB=null; warpT=0; warpCd=0; levelT=0;
  const GT=10;                     // ground-top row (build-space)
  const api={
    ground(pits){ const isPit=x=>pits&&pits.some(([a,b])=>x>=a&&x<=b);
      for(let x=0;x<W;x++) if(!isPit(x)) for(let y=GT;y<13;y++) grid[y+SKY][x]=1; },
    island(x,y,w,h=1){ for(let j=0;j<h;j++) for(let i=0;i<w;i++){ const r=y+j+SKY; if(x+i<W&&r>=0&&r<H) grid[r][x+i]=1; } },
    plat(x,y,w){ const r=y+SKY; if(r<0||r>=H) return; for(let i=0;i<w;i++) if(x+i<W) grid[r][x+i]=2; },
    ceiling(){ for(let x=0;x<W;x++) grid[0][x]=1; },
    coin(x,y,n=1,dir=1){ for(let i=0;i<n;i++) coins.push({x:(x+i*dir)*TILE+TILE/2, y:(y+SKY)*TILE+TILE/2, got:false}); },
    en(x,y=GT-1){ enemies.push({type:'walk', x:x*TILE, y:(y+SKY)*TILE-2, w:30,h:30, vx:60, vy:0, dir:-1, alive:true, stun:0}); },
    fly(x,y=GT-4){ enemies.push({type:'fly', x:x*TILE, y:(y+SKY)*TILE, w:32,h:24, vx:80, vy:0, dir:-1, alive:true, stun:0, baseY:(y+SKY)*TILE, phase:x*0.7}); },
    jump(x,y=GT-1){ enemies.push({type:'jump', x:x*TILE, y:(y+SKY)*TILE-2, w:30,h:30, vx:45, vy:0, dir:-1, alive:true, stun:0, t:(x%3)*0.4, onGround:false}); },
    shoot(x,y=GT-1){ enemies.push({type:'shoot', x:x*TILE, y:(y+SKY)*TILE-2, w:30,h:32, vx:0, vy:0, dir:-1, alive:true, stun:0, t:1.4, onGround:false}); },
    chase(x,y=GT-1){ enemies.push({type:'chase', x:x*TILE, y:(y+SKY)*TILE-2, w:30,h:30, vx:60, vy:0, dir:-1, alive:true, stun:0, chasing:false, onGround:false}); },
    spk(x,w,y=GT){ for(let i=0;i<w;i++) spikes.push({x:(x+i)*TILE, y:(y+SKY)*TILE}); },
    box(x,y){ boxes.push({x:x*TILE+4, y:(y+SKY)*TILE+4, w:32, h:36, open:false}); },
  };
  def.build(api);
  // ---- auto-placed features: every level gets springs, movers, a checkpoint, gems + a wonder flower ----
  const floorRow=tx=>{ for(let r=H-1;r>=SKY;r--){ if(grid[r][tx] && !(r>0&&grid[r-1][tx])) return r; } return -1; };
  const clearOfStuff=tx=>!spikes.some(s=>Math.abs(s.x/TILE-tx)<2)&&!boxes.some(b=>Math.abs(b.x/TILE-tx)<2)&&!enemies.some(e=>e.type==='shoot'&&Math.abs(e.x/TILE-tx)<2);
  const safeCol=(target,skip)=>{ for(let d=0;d<W;d++) for(const tx of [target+d,target-d]){ if(tx<4||tx>W-8) continue; if(skip&&skip.includes(tx)) continue; const r=floorRow(tx); if(r<0) continue; if(clearOfStuff(tx)) return tx; } return -1; };
  const usedCols=[];
  for(const fr of [0.3,0.65]){ const tx=safeCol(Math.round(W*fr),usedCols);       // bounce springs
    if(tx>=0){ usedCols.push(tx-1,tx,tx+1); const r=floorRow(tx); springs.push({x:tx*TILE+4,y:r*TILE-14,w:TILE-8,h:14,t:0}); } }
  { const tx=safeCol(Math.round(W*0.5),usedCols);                                 // mid-level checkpoint
    if(tx>=0){ usedCols.push(tx-1,tx,tx+1); checkpoint={x:tx*TILE+10,y:floorRow(tx)*TILE,active:false}; } }
  { const pits=[]; let a=-1;                                                      // movers patrol the two widest pits
    for(let tx=0;tx<=W;tx++){ const gap=tx<W&&floorRow(tx)<0; if(gap&&a<0)a=tx; if(!gap&&a>=0){ pits.push([a,tx-1]); a=-1; } }
    pits.sort((u,v)=>(v[1]-v[0])-(u[1]-u[0]));
    for(const [pa,pb] of pits.slice(0,2)){ if(pb-pa<1) continue;
      const rr=Math.min(...[pa-1,pb+1].map(t=>{const r=floorRow(t);return r<0?H-3:r;}));
      const mx0=(pa-1)*TILE, mx1=(pb+2)*TILE-TILE*3;
      movers.push({x:mx0,y:(rr-3)*TILE,w:TILE*3,h:16,vx:70,x0:Math.min(mx0,mx1),x1:Math.max(mx0,mx1)}); } }
  { let sky=null;                                                                 // gem 1: high above the sky route
    for(let r=0;r<SKY&&!sky;r++){ const run=[]; for(let tx=0;tx<W;tx++) if(grid[r][tx]) run.push(tx); if(run.length) sky=[r,run[Math.floor(run.length/2)]]; }
    if(sky) gems.push({x:sky[1]*TILE+TILE/2,y:(sky[0]-2)*TILE,i:0,got:false});
    let wide=null,a2=-1;                                                          // gem 2: hovering over the widest pit
    for(let tx=0;tx<=W;tx++){ const gap=tx<W&&floorRow(tx)<0; if(gap&&a2<0)a2=tx; if(!gap&&a2>=0){ if(!wide||tx-a2>wide[1]-wide[0]+1) wide=[a2,tx-1]; a2=-1; } }
    if(wide){ const rw=floorRow(wide[0]-1); gems.push({x:(wide[0]+wide[1]+1)/2*TILE,y:(rw<0?10+SKY:rw)*TILE-60,i:1,got:false}); }
    let late=null;                                                                // gem 3: high perch late in the level
    for(let r=SKY;r<H&&!late;r++) for(let tx=W-1;tx>Math.floor(W*0.7);tx--) if(grid[r][tx]&&!(r>0&&grid[r-1][tx])){ late=[r,tx]; break; }
    if(late) gems.push({x:late[1]*TILE+TILE/2,y:(late[0]-3)*TILE,i:2,got:false});
    const gs=gemStore[curLevel]||[]; gems.forEach(g=>{ if(gs[g.i]) g.pre=true; });
  }
  { const vx0=W-16;                                                               // warp door → sealed coin vault in the far sky corner
    const tx=safeCol(Math.round(W*0.42),usedCols);
    if(tx>=0){ usedCols.push(tx-1,tx,tx+1);
      for(let x=vx0;x<W;x++){ grid[0][x]=1; grid[5][x]=1; }                       // ceiling + floor
      for(let r=1;r<5;r++){ grid[r][vx0]=1; grid[r][W-1]=1; for(let x=vx0+1;x<W-1;x++) grid[r][x]=0; }
      for(let x=vx0+2;x<W-2;x++){ coins.push({x:x*TILE+TILE/2, y:2*TILE+TILE/2, got:false}); coins.push({x:x*TILE+TILE/2, y:3*TILE+TILE/2, got:false}); }
      doorA={x:tx*TILE+TILE/2, y:floorRow(tx)*TILE};
      doorB={x:(vx0+2)*TILE+TILE/2, y:5*TILE}; } }
  { let spot=null,bd=1e9;                                                         // wonder flower on an elevated platform near 55%
    for(let r=SKY;r<10+SKY-1;r++) for(let tx=4;tx<W-8;tx++){ if(grid[r][tx]&&!(grid[r-1]&&grid[r-1][tx])){ const d=Math.abs(tx-W*0.55); if(d<bd){ bd=d; spot=[r,tx]; } } }
    if(!spot){ const tx=safeCol(Math.round(W*0.55),usedCols); if(tx>=0) spot=[floorRow(tx),tx]; }
    if(spot) wonder={x:spot[1]*TILE+TILE/2,y:spot[0]*TILE-24,used:false};
  }
  boss=null;
  if(def.boss){
    const cfg=def.boss, fxc=def.flagX!=null?def.flagX:(W-4), ftc=def.flagTop!=null?def.flagTop:GT;
    const big=cfg.hp>=6, bw=big?76:60, bh=big?66:52;
    boss={ x:(cfg.x!=null?cfg.x:fxc-2)*TILE, y:(ftc+SKY)*TILE-bh, w:bw, h:bh,
           hp:cfg.hp, maxHp:cfg.hp, nm:cfg.nm, col:cfg.col, shots:cfg.shots, hop:cfg.hop||(big?140:110),
           active:false, alive:true, vx:0, vy:0, onGround:false, hopT:1.2, shotT:4, inv:0, face:-1 };
  }
  const fx=def.flagX!=null?def.flagX:(W-4), ft=(def.flagTop!=null?def.flagTop:GT)+SKY;
  flag={ x:fx*TILE, top:ft*TILE - TILE*6, h:TILE*6 };
  const sx=def.startX!=null?def.startX:2, st=(def.startTop!=null?def.startTop:GT)+SKY;
  startPx={ x:sx*TILE, y:st*TILE-40 };
}
// ---------- boss rush ----------
function rushBest(){ return +(localStorage.getItem('hopRushBest')||0); }
function saveRushBest(n){ try{ if(n>rushBest()) localStorage.setItem('hopRushBest',n); }catch(e){} }
function buildRushArena(i){

  springs=[]; movers=[]; gems=[]; checkpoint=null; wonder=null; wonderT=0; wonderFx=null; gMul=1;
  doorA=null; doorB=null; warpT=0; warpCd=0; levelT=0;
  for(let x=0;x<W;x++) for(let y=GT;y<13;y++) grid[y+SKY][x]=1;         // solid floor, no pits
  const lay=[[[6,7,3],[14,5,3],[35,7,3]],[[8,6,3],[20,4,3],[32,6,3]],[[5,7,3],[22,5,4],[37,7,3]]][i%3];
  lay.forEach(([x,y,w])=>{ for(let k=0;k<w;k++) grid[y+SKY][x+k]=2; }); // a few hop platforms
  boxes.push({x:lay[0][0]*TILE+8, y:(lay[0][1]-1+SKY)*TILE+4, w:32, h:36, open:false});
  const cfg=def.boss, big=cfg.hp>=6, bw=big?76:60, bh=big?66:52;
  boss={ x:(W-8)*TILE, y:(GT+SKY)*TILE-bh, w:bw, h:bh,
         hp:cfg.hp, maxHp:cfg.hp, nm:cfg.nm, col:cfg.col, shots:cfg.shots, hop:cfg.hop||(big?140:110),
         active:true, alive:true, vx:0, vy:0, onGround:false, hopT:1.2, shotT:2.5, inv:0, face:-1 };
  flag={ x:W*TILE+400, top:0, h:1 };                                    // off-map: no flag wins in rush
  startPx={ x:3*TILE, y:(GT+SKY)*TILE-40 };
  rushAdv=false;
}
function startRush(){ rushMode=true; rushIdx=0; buildRushArena(0); resetPlayer(); state='play'; winFlash=0; deathTimer=0; hideOverlays(); setTrack('boss'); }
function solidAt(tx,ty){
  if(tx<0||tx>=W) return true;      // level walls
  if(ty<0) return false;            // open sky
  if(ty>=H) return false;           // below level = fall to death (not solid)
  return grid[ty][tx]!==0;
}

// ---------- player ----------
let p, cam, coinsGot, hearts, maxHearts, state='start', winFlash=0, deathTimer=0;

function startGame(idx){ rushMode=false; if(idx==null) idx=menuLevel; menuLevel=((idx%LEVELS.length)+LEVELS.length)%LEVELS.length; saveHero(); buildLevel(menuLevel); resetPlayer(); state='play'; winFlash=0; deathTimer=0; hideOverlays(); setTrack(LEVELS[menuLevel].music||'cheery'); }

// ---------- input ----------
const keys={left:false,right:false,jump:false,jumpEdge:false,act:false,actEdge:false};
const KM={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'jump',w:'jump',W:'jump',' ':'jump',Shift:'act'};
addEventListener('keydown',e=>{ const k=KM[e.key]; if(k){ if(k==='jump'&&!keys.jump) keys.jumpEdge=true; if(k==='act'&&!keys.act) keys.actEdge=true; keys[k]=true; e.preventDefault(); }});
addEventListener('keyup',e=>{ const k=KM[e.key]; if(k){ keys[k]=false; e.preventDefault(); }});
function hold(id,k){ const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{ e.preventDefault(); if(k==='jump'&&!keys.jump)keys.jumpEdge=true; if(k==='act'&&!keys.act)keys.actEdge=true; keys[k]=true; });

// ---------- physics helpers ----------
const G=2100, RUN=250, ACC=1900, FRIC=1700, AIRACC=1500, JUMP=640, MAXFALL=1000;
const DASH_SPD=560, DASH_TIME=0.16, DASH_CD=0.7, GLIDE=150, POUND=1150;
const SMALLW=24, SMALLH=30, BIGW=46, BIGH=58;   // hero size normal vs grown
const GIFT_ICONS={heart:'❤️', shield:'🛡️', grow:'🍄', stars:'⭐', drill:'⛏️', bubble:'🫧'};
function tilesOverlap(x,y,w,h,fn){
  const x0=Math.floor(x/TILE), x1=Math.floor((x+w-1)/TILE), y0=Math.floor(y/TILE), y1=Math.floor((y+h-1)/TILE);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++) if(solidAt(tx,ty)) if(fn(tx,ty)) return true;
  return false;
}
function moveX(e,dx){
  e.x+=dx;
  const x0=Math.floor(e.x/TILE), x1=Math.floor((e.x+e.w-1)/TILE), y0=Math.floor(e.y/TILE), y1=Math.floor((e.y+e.h-1)/TILE);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++) if(solidAt(tx,ty)){
    if(dx>0) e.x=tx*TILE-e.w; else if(dx<0) e.x=(tx+1)*TILE;
    e.vx=0; return true;
  }
  return false;
}
function moveY(e,dy){
  e.y+=dy; let hitDown=false;
  const x0=Math.floor(e.x/TILE), x1=Math.floor((e.x+e.w-1)/TILE), y0=Math.floor(e.y/TILE), y1=Math.floor((e.y+e.h-1)/TILE);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++) if(solidAt(tx,ty)){
    if(dy>0){ e.y=ty*TILE-e.h; hitDown=true; } else if(dy<0){ e.y=(ty+1)*TILE; }
    e.vy=0; return hitDown;
  }
  return false;
}

// ---------- update ----------
function update(dt){
  if(state!=='play' && state!=='dying') return;
  if(state==='dying'){ deathTimer-=dt; p.vy+=G*dt; p.y+=p.vy*dt; if(deathTimer<=0) loseLife(); return; }
  const pl=p; pl.anim+=dt;
  // timers
  pl.coyote-=dt; pl.jumpBuf-=dt; pl.dashCd-=dt; if(pl.hurt>0) pl.hurt-=dt;
  if(pl.shootFlash>0) pl.shootFlash-=dt;
  if(pl.shieldT>0) pl.shieldT-=dt;
  if(pl.wantBig && !pl.big){ // grow only once there's room for the bigger body (feet stay planted)
    const nx=pl.x-(BIGW-pl.w)/2, ny=pl.y+pl.h-BIGH;
    if(!tilesOverlap(nx,ny,BIGW,BIGH,()=>true)){ pl.x=nx; pl.y=ny; pl.w=BIGW; pl.h=BIGH; pl.big=true; }
  }
  if(!pl.wantBig && pl.big){ pl.x+=(pl.w-SMALLW)/2; pl.y+=pl.h-SMALLH; pl.w=SMALLW; pl.h=SMALLH; pl.big=false; }
  if(keys.jumpEdge){ pl.jumpBuf=0.12; keys.jumpEdge=false; }
  // horizontal input
  const dir=(keys.right?1:0)-(keys.left?1:0);
  if(dir) pl.face=dir;
  const a=pl.onGround?ACC:AIRACC;
  if(pl.dashT>0){ pl.dashT-=dt; pl.vx=DASH_SPD*pl.face; }
  else{
    if(dir){ pl.vx+=dir*a*dt; pl.vx=Math.max(-RUN,Math.min(RUN,pl.vx)); }
    else{ const f=FRIC*dt; if(pl.vx>0) pl.vx=Math.max(0,pl.vx-f); else pl.vx=Math.min(0,pl.vx+f); }
  }
  // act button: star shot (if you have ammo), else dash / ground-pound
  if(keys.actEdge){ keys.actEdge=false;
    if(pl.stars>0){ pl.stars--; sfx('star'); pl.shootFlash=0.09;
      projectiles.push({x:pl.face>0?pl.x+pl.w+10:pl.x-10, y:pl.y+pl.h*0.5+3, vx:pl.face*430, vy:0, life:1.6, friendly:true}); }
    else if(pl.bubbles>0){ pl.bubbles--; sfx('bubble'); pl.shootFlash=0.09;
      projectiles.push({x:pl.face>0?pl.x+pl.w+10:pl.x-10, y:pl.y+pl.h*0.4, vx:pl.face*250, vy:-20, life:2.6, friendly:true, bubble:true}); }
    else if((has('pound')||pl.drillT>0) && !pl.onGround && !pl.pounding){ pl.pounding=true; pl.vy=POUND; pl.vx=0; }
    else if(has('dash') && pl.dashCd<=0){ pl.dashT=DASH_TIME; pl.dashCd=DASH_CD; pl.vy=Math.min(pl.vy,0); }
  }
  // drill: smash straight through platform tiles while slamming down
  if(pl.drillT>0){ pl.drillT-=dt;
    if(pl.pounding){ const y0=pl.y+pl.h, y1=y0+Math.max(10,pl.vy*dt+6);
      for(let ty=Math.floor(y0/TILE); ty<=Math.floor(y1/TILE); ty++)
        for(let tx=Math.floor(pl.x/TILE); tx<=Math.floor((pl.x+pl.w-1)/TILE); tx++){
          if(grid[ty]&&grid[ty][tx]===2){ grid[ty][tx]=0; addPop(tx*TILE+TILE/2,ty*TILE); sfx('stomp'); } } } }
  // jump
  const canJump = pl.onGround || pl.coyote>0 || (has('double') && pl.jumps<2 && pl.jumps>0);
  const jm=pl.big?1.35:1;   // giant hero jumps much higher
  if(pl.jumpBuf>0){
    if(pl.onGround||pl.coyote>0){ pl.vy=-(JUMP*(has('highjump')?1.3:1)*jm); pl.jumps=1; pl.jumpBuf=0; pl.coyote=0; pl.onGround=false; }
    else if(has('double') && pl.jumps===1){ pl.vy=-(JUMP*(has('highjump')?1.28:1.1)*jm); pl.jumps=2; pl.jumpBuf=0; }
  }
  // variable jump height (release early = shorter)
  if(!keys.jump && pl.vy<0) pl.vy+=G*gMul*1.6*dt;
  // gravity + glide (gMul drops during the low-gravity wonder effect)
  pl.vy+=G*gMul*dt;
  if(has('glide') && keys.jump && pl.vy>0 && !pl.pounding) pl.vy=Math.min(pl.vy,GLIDE);
  pl.vy=Math.min(pl.vy,MAXFALL + (pl.pounding?600:0));
  // integrate with tile collision
  moveX(pl,pl.vx*dt);
  const wasAir=!pl.onGround;
  const landed=moveY(pl,pl.vy*dt);
  if(landed){ if(pl.onGround===false && wasAir) {} pl.onGround=true; pl.jumps=0; if(pl.pounding){ pl.pounding=false; poundShake=0.25; } }
  else pl.onGround=false;

  // fell in a pit
  if(pl.y>H*TILE+80){ startDeath(); }
  // trail
  if(has('dash')||true){ pl.trail.unshift({x:pl.x+pl.w/2,y:pl.y+pl.h/2}); if(pl.trail.length>8) pl.trail.pop(); }

  // enemies
  for(const en of enemies){ if(!en.alive) continue;
    const et=en.type||'walk';
    if(en.bubbled>0){ en.bubbled-=dt;  // trapped in a bubble: floats up, pop it for coins!
      en.y-=34*dt; en.x+=Math.sin(performance.now()/400+en.x)*14*dt;
      if(en.y<TILE) en.y=TILE;                        // don't float off the top
      if(pl.hurt<=0 && rectHit(pl,en)){ en.alive=false; addPop(en.x+en.w/2,en.y+en.h/2); sfx('pop');
        for(let k=0;k<3;k++) coins.push({x:en.x+en.w/2+(k-1)*24, y:en.y+10, got:false});
        pl.vy=Math.min(pl.vy,-320); }
      continue; }
    if(en.stun>0){ en.stun-=dt;        // frozen by a wonder flower: harmless, stompable statue
      if(pl.hurt<=0 && rectHit(pl,en) && ((pl.vy>0&&(pl.y+pl.h)-en.y<20)||pl.pounding||pl.big)){
        en.alive=false; if(!pl.pounding&&!pl.big) pl.vy=-460; addPop(en.x+en.w/2,en.y); sfx('stomp'); }
      continue; }
    if(et==='fly'){
      // hovers: no gravity, drifts + bobs, reverses at walls
      en.vx=80*en.dir;
      if(moveX(en,en.vx*dt)) en.dir*=-1;
      en.phase+=dt; en.y=en.baseY+Math.sin(en.phase*2.2)*28;
    }
    else if(et==='shoot'){

      en.vy+=G*dt; en.vy=Math.min(en.vy,MAXFALL); moveY(en,en.vy*dt);
      en.dir=(pl.x+pl.w/2 < en.x+en.w/2)?-1:1;
      en.t-=dt;
      if(en.t<=0 && Math.abs((pl.y+pl.h/2)-(en.y+en.h/2))<TILE*3 && Math.abs(pl.x-en.x)<VW*0.75){
        en.t=1.6; sfx('shoot');
        projectiles.push({x:en.dir>0?en.x+en.w:en.x, y:en.y+12, vx:en.dir*190, vy:0, life:5});
      }
    }
    else { // walk, jump, chase — grounded patrollers
      let spd=60;
      if(et==='chase'){
        const near=Math.abs((pl.x+pl.w/2)-(en.x+en.w/2))<260 && Math.abs((pl.y+pl.h/2)-(en.y+en.h/2))<70;
        en.chasing=near;

      }
      en.vx=spd*en.dir;
      en.vy+=G*dt; en.vy=Math.min(en.vy,MAXFALL);
      if(et==='jump'){ en.t-=dt; if(en.t<=0 && en.onGround){ en.vy=-560; en.onGround=false; en.t=1.3; } }
      if(moveX(en,en.vx*dt)) en.dir*=-1;                 // reverse at wall

      if(et!=='jump' && !(et==='chase'&&en.chasing)){
        const aheadX=en.dir>0?en.x+en.w+2:en.x-2;
        const footTx=Math.floor(aheadX/TILE), footTy=Math.floor((en.y+en.h+2)/TILE);
        if(!solidAt(footTx,footTy)) en.dir*=-1;
      }
      en.onGround=moveY(en,en.vy*dt);
    }
    if(en.y>H*TILE+80){ en.alive=false; continue; }
    // vs player — stomp/pound from above kills; flyers count too
    if(pl.hurt<=0 && rectHit(pl,en)){
      if(pl.big){ en.alive=false; addPop(en.x+en.w/2,en.y); sfx('stomp'); }   // giant hero squashes on touch
      else if((pl.vy>0 && (pl.y+pl.h)-en.y < 20) || pl.pounding){
        en.alive=false; if(!pl.pounding) pl.vy=-460; addPop(en.x+en.w/2,en.y); sfx('stomp');
      } else hitPlayer();
    }
  }
  // projectiles (enemy shots + the player's stars)
  for(const pr of projectiles){ if(pr.dead) continue;
    pr.life-=dt; pr.x+=pr.vx*dt; pr.y+=pr.vy*dt;
    if(pr.life<=0 || solidAt(Math.floor(pr.x/TILE),Math.floor(pr.y/TILE))){ pr.dead=true; continue; }
    if(pr.friendly){
      if(pr.bubble) pr.vy-=30*dt;   // bubbles drift upward
      if(boss&&boss.alive&&boss.active&&boss.inv<=0 && pr.x>boss.x-6 && pr.x<boss.x+boss.w+6 && pr.y>boss.y-6 && pr.y<boss.y+boss.h+6){
        pr.dead=true; if(pr.bubble){ addPop(pr.x,pr.y); sfx('pop'); } else bossHit(); continue; }
      for(const en of enemies){ if(en.alive && !en.bubbled && pr.x>en.x-6 && pr.x<en.x+en.w+6 && pr.y>en.y-6 && pr.y<en.y+en.h+6){
        pr.dead=true;
        if(pr.bubble){ en.bubbled=8; en.vx=0; en.vy=0; sfx('bubble'); }
        else{ en.alive=false; addPop(en.x+en.w/2,en.y); sfx('stomp'); }
        break; } }
      continue;
    }

  }
  // present boxes — stomp (or pound) the lid to pop them open

    if((pl.vy>0||pl.pounding) && rectHit(pl,bx) && (pl.y+pl.h)-bx.y<22){
      bx.open=true; if(!pl.pounding) pl.vy=-460; sfx('box'); addPop(bx.x+bx.w/2,bx.y);
      const r=Math.random(), type=r<.2?'heart':r<.4?'shield':r<.6?'grow':r<.75?'stars':r<.87?'drill':'bubble';
      presents.push({x:bx.x+bx.w/2, y:bx.y-26, type, t:0, got:false});
    }
  }
  // floating presents — touch to collect
  for(const g of presents){ if(g.got) continue; g.t+=dt;
    const gy=g.y+Math.sin(g.t*3)*4;
    if(Math.abs((pl.x+pl.w/2)-g.x)<26+pl.w/2 && Math.abs((pl.y+pl.h/2)-gy)<30+pl.h/2){
      g.got=true; sfx('power');
      if(g.type==='heart') hearts=Math.min(maxHearts,hearts+1);
      else if(g.type==='shield') pl.shieldT=8;
      else if(g.type==='grow') pl.wantBig=true;
      else if(g.type==='drill') pl.drillT=15;
      else if(g.type==='bubble') pl.bubbles+=5;
      else pl.stars+=10;
      toasts.push({x:g.x, y:gy-22, ic:GIFT_ICONS[g.type], t:1});
    }
  }
  // coins

    if(c.fall){ c.vy+=500*dt; c.y+=c.vy*dt; const trow=Math.floor((c.y+12)/TILE);   // wonder coin-rain drops
      if(solidAt(Math.floor(c.x/TILE),trow)){ c.fall=false; c.y=trow*TILE-14; } }
    if(has('magnet')){ const dx=(pl.x+pl.w/2)-c.x, dy=(pl.y+pl.h/2)-c.y, d=Math.hypot(dx,dy); if(d<140){ c.x+=dx/d*260*dt; c.y+=dy/d*260*dt; } }
    if(Math.abs((pl.x+pl.w/2)-c.x)<22 && Math.abs((pl.y+pl.h/2)-c.y)<24){ c.got=true; coinsGot++; sfx('coin'); }
  }

  // springs — land on one to launch skyward
  for(const s of springs){ if(s.t>0) s.t-=dt;
    if(pl.vy>0 && pl.x+pl.w>s.x+2 && pl.x<s.x+s.w-2 && pl.y+pl.h>s.y-2 && pl.y+pl.h<s.y+s.h+14){
      pl.y=s.y-pl.h; pl.vy=-1150; pl.jumps=1; pl.pounding=false; s.t=0.3; sfx('spring'); } }
  // moving platforms — one-way top surface that carries the player
  for(const m of movers){ const dxm=m.vx*dt; m.x+=dxm; if(m.x<m.x0||m.x>m.x1){ m.vx*=-1; m.x=Math.max(m.x0,Math.min(m.x,m.x1)); }
    if(pl.vy>=0 && pl.x+pl.w>m.x+4 && pl.x<m.x+m.w-4){ const pb=pl.y+pl.h;
      if(pb>=m.y-6 && pb<=m.y+16){ pl.y=m.y-pl.h; pl.vy=0; pl.onGround=true; pl.jumps=0; pl.coyote=0.09; pl.x+=dxm; } } }
  // checkpoint — run past to activate

  // wonder flower — touch to flip the rules for a few seconds

    if(wonderFx==='lowgrav') gMul=0.45;
    else if(wonderFx==='giant'){ pl.wantBig=true; pl.shieldT=Math.max(pl.shieldT,9); }

    else if(warpT>0 && Math.abs(pl.x+pl.w/2-doorB.x)<24 && pl.y+pl.h>doorB.y-TILE*1.6 && pl.y+pl.h<doorB.y+8){

let poundShake=0, rainT=0;
function rectHit(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

function hitPlayer(){ if(p.hurt>0) return;
  if(p.shieldT>0){ p.hurt=0.4; sfx('shield'); return; }   // shield soaks the hit

    addPop(pet.x,pet.y); toasts.push({x:pet.x,y:pet.y-18,ic:'🐣',t:1.2}); return; }
  if(p.big||p.wantBig){ p.wantBig=false; p.hurt=1.1; p.vy=-320; p.vx=-p.face*260; sfx('hurt'); return; }  // lose your size, not a heart

    const P=tr.perc&&tr.perc[i]; if(P===2) mKick(mus.nextT); else if(P===1) mHat(mus.nextT);

function render(){

function drawBoss(){ const b=boss, bw=b.w, bh=b.h, cx=b.x+bw/2, by=b.y;

  ctx.fillStyle='#222'; const ex=b.face*3; ctx.beginPath(); ctx.arc(cx-14*s+ex,eyeY+1,4*s,0,7); ctx.arc(cx+14*s+ex,eyeY+1,4*s,0,7); ctx.fill();

  ctx.beginPath(); ctx.moveTo(cx-24*s,eyeY-12*s); ctx.lineTo(cx-6*s,eyeY-6*s); ctx.moveTo(cx+24*s,eyeY-12*s); ctx.lineTo(cx+6*s,eyeY-6*s); ctx.stroke();

function drawBox(bx){ const x=bx.x, y=bx.y, w=bx.w, h=bx.h;

function drawHero(){

    ctx.beginPath(); ctx.ellipse(cx-5,cy+h/2-1+fw,5,3.4,0,0,7); ctx.ellipse(cx+5,cy+h/2-1-fw,5,3.4,0,0,7); ctx.fill();
    // eyes
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(cx-4,cy-4,3.6,4.4,0,0,7); ctx.ellipse(cx+6,cy-4,3.6,4.4,0,0,7); ctx.fill();
    ctx.fillStyle='#222'; const ex=b.face*1.6; ctx.beginPath(); ctx.arc(cx-4+ex,cy-4,2,0,7); ctx.arc(cx+6+ex,cy-4,2,0,7); ctx.fill();
    // smile
    ctx.strokeStyle='#5a3a2a'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.arc(cx+1,cy+3,3,0.1*Math.PI,0.9*Math.PI); ctx.stroke();
    if(b.stars>0){ // star blaster in hand
      const gs=b.big?1.5:1, gx=cx+b.face*(w/2+4*gs), gy=cy+3*gs;
      ctx.fillStyle='#3a2a1a'; ctx.beginPath(); ctx.arc(cx+b.face*(w/2-1),gy,4*gs,0,7); ctx.fill();
      ctx.fillStyle='#5a6470'; roundRect(gx-7*gs,gy-5*gs,14*gs,10*gs,3*gs); ctx.fill();
      ctx.fillStyle='#8a94a0'; ctx.fillRect(gx+(b.face>0?5*gs:-13*gs),gy-3*gs,8*gs,6*gs);
      ctx.fillStyle='#ffd54a'; ctx.beginPath(); ctx.arc(gx,gy,2.6*gs,0,7); ctx.fill();
      if(b.shootFlash>0){ const mx=gx+b.face*15*gs;
        ctx.fillStyle='rgba(255,230,140,.9)'; ctx.beginPath(); ctx.arc(mx,gy,6*gs,0,7); ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.95)'; ctx.beginPath(); ctx.arc(mx,gy,3*gs,0,7); ctx.fill(); }
    }
    drawHat(cx,cy-h/2);
  }
  if(b.shieldT>0 && (b.shieldT>2 || Math.floor(performance.now()/120)%2===0)){
    ctx.fillStyle='rgba(120,220,255,.14)'; ctx.strokeStyle='rgba(120,220,255,.8)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(cx,cy,Math.max(b.w,b.h)*0.75,0,7); ctx.fill(); ctx.stroke();
  }
}
function drawPet(){ const px=pet.x, py=pet.y, rdy=pet.cd<=0;
  ctx.save(); ctx.globalAlpha=rdy?1:0.55;
  ctx.fillStyle='rgba(0,0,0,.12)'; ctx.beginPath(); ctx.ellipse(px,py+13,8,2.6,0,0,7); ctx.fill();
  const flap=Math.abs(Math.sin(performance.now()/110))*4;
  ctx.fillStyle=rdy?'#ffe066':'#cfc9a8';
  ctx.beginPath(); ctx.ellipse(px-9,py+1,5,2.6+flap*0.5,-0.5,0,7); ctx.fill();       // wing
  ctx.beginPath(); ctx.arc(px,py,9,0,7); ctx.fill();                                  // body
  ctx.beginPath(); ctx.arc(px+2,py-8,6.4,0,7); ctx.fill();                            // head
  ctx.fillStyle='#ff9d3a'; ctx.beginPath(); ctx.moveTo(px+8,py-8); ctx.lineTo(px+13,py-6.6); ctx.lineTo(px+8,py-5.2); ctx.closePath(); ctx.fill();  // beak
  ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(px+4,py-9,1.5,0,7); ctx.fill();      // eye
  if(rdy){ ctx.fillStyle='rgba(255,255,255,.9)'; ctx.font='9px sans-serif'; ctx.textAlign='center';
    if(Math.floor(performance.now()/800)%4===0) ctx.fillText('♪',px-2,py-16); }
  ctx.restore();
}
function drawHat(cx,topY){
  if(sel.hat==='cap'){ ctx.fillStyle='#e23b3b'; ctx.beginPath(); ctx.arc(cx,topY+3,11,Math.PI,2*Math.PI); ctx.fill(); ctx.fillRect(cx-11,topY+2,26,4); ctx.fillStyle='#b52a2a'; ctx.fillRect(cx+9,topY+1,10,4); }
  else if(sel.hat==='crown'){ ctx.fillStyle='#ffd54a'; ctx.beginPath(); ctx.moveTo(cx-11,topY+4); ctx.lineTo(cx-11,topY-6); ctx.lineTo(cx-5,topY); ctx.lineTo(cx,topY-8); ctx.lineTo(cx+5,topY); ctx.lineTo(cx+11,topY-6); ctx.lineTo(cx+11,topY+4); ctx.closePath(); ctx.fill(); ctx.fillStyle='#ff5b5b'; ctx.beginPath(); ctx.arc(cx,topY+1,2,0,7); ctx.fill(); }
  else if(sel.hat==='party'){ ctx.fillStyle='#ff7ad1'; ctx.beginPath(); ctx.moveTo(cx-9,topY+4); ctx.lineTo(cx,topY-16); ctx.lineTo(cx+9,topY+4); ctx.closePath(); ctx.fill(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx,topY-16,2.5,0,7); ctx.fill(); ctx.fillStyle='#46c8ff'; ctx.fillRect(cx-6,topY-4,3,3); ctx.fillRect(cx+3,topY-8,3,3); }
  else if(sel.hat==='horn'){ ctx.fillStyle='#ffe08a'; ctx.beginPath(); ctx.moveTo(cx-4,topY+3); ctx.lineTo(cx,topY-15); ctx.lineTo(cx+4,topY+3); ctx.closePath(); ctx.fill(); ctx.strokeStyle='#d6a53a'; ctx.lineWidth=1.5; ctx.stroke(); }
  else if(sel.hat==='wiz'){ ctx.fillStyle='#5a4ae0'; ctx.beginPath(); ctx.moveTo(cx-12,topY+4); ctx.lineTo(cx+2,topY-18); ctx.lineTo(cx+12,topY+4); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#ffd54a'; ctx.font='8px sans-serif'; ctx.textAlign='center'; ctx.fillText('★',cx+1,topY-4); ctx.fillRect(cx-13,topY+3,26,3); }
  else if(sel.hat==='astro'){ ctx.fillStyle='rgba(255,255,255,.92)'; ctx.beginPath(); ctx.arc(cx,topY+2,11,Math.PI,2*Math.PI); ctx.fill();
    ctx.strokeStyle='#8ab8d8'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,topY+2,11,Math.PI,2*Math.PI); ctx.stroke();
    ctx.fillStyle='#46c8ff'; ctx.fillRect(cx-7,topY-4,14,4); }
  else if(sel.hat==='pirate'){ ctx.fillStyle='#20242c'; ctx.beginPath(); ctx.moveTo(cx-14,topY+3); ctx.quadraticCurveTo(cx,topY-14,cx+14,topY+3); ctx.quadraticCurveTo(cx,topY-2,cx-14,topY+3); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx,topY-4,2.4,0,7); ctx.fill(); }
}
function lighten(hex){ const n=parseInt(hex.slice(1),16); let r=(n>>16)+40,g=((n>>8)&255)+40,b=(n&255)+40; r=Math.min(255,r);g=Math.min(255,g);b=Math.min(255,b); return 'rgb('+r+','+g+','+b+')'; }
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawHUD(){
  const el=document.getElementById('hud');
  if(state==='start'){ el.innerHTML=''; return; }
  let h=''; for(let i=0;i<maxHearts;i++) h+= i<hearts?'❤️':'🤍';
  let extra='';
  if(p&&p.shieldT>0) extra+='<span>🛡️'+Math.ceil(p.shieldT)+'</span>';
  if(p&&(p.big||p.wantBig)) extra+='<span>🍄</span>';
  if(p&&p.stars>0) extra+='<span>⭐×'+p.stars+'</span>';
  if(p&&p.bubbles>0) extra+='<span>🫧×'+p.bubbles+'</span>';
  if(p&&p.drillT>0) extra+='<span>⛏️'+Math.ceil(p.drillT)+'</span>';
  if(wonderT>0) extra+='<span>🌸'+Math.ceil(wonderT)+'</span>';
  if(warpT>0) extra+='<span>🚪'+Math.ceil(warpT)+'</span>';
  if(!rushMode) extra+='<span style="color:#9fb6d4">⏱'+fmtT(levelT)+'</span>';
  const gg=gems?gems.filter(g=>g.got).length:0, gt=gems?gems.length:0;
  el.innerHTML='<span>'+h+'</span><span>🪙 '+coinsGot+'/'+coins.length+'</span>'+(gt?'<span>💎'+gg+'/'+gt+'</span>':'')+extra+'<span style="color:#cfe6ff">🗺️ '+(curLevel+1)+'· '+curName+'</span>';
}

// ---------- overlays / UI ----------
function hideOverlays(){ ['startScreen','overScreen','victoryScreen'].forEach(id=>document.getElementById(id).classList.add('hidden')); }
function toMenu(){ state='start'; rushMode=false; hideOverlays(); document.getElementById('startScreen').classList.remove('hidden'); buildMenu(); setTrack('title'); }
function win(){ sfx('win');
  if(curLevel>=LEVELS.length-1){ const tf=Math.round(levelT);
    if(!rushMode && (timeStore[curLevel]==null||tf<timeStore[curLevel])){ timeStore[curLevel]=tf; saveTimes(); }
    showVictory(); return; }
  setTrack(null);
  const o=document.getElementById('overScreen'), rt=document.getElementById('resultText');
  rt.className='big win'; rt.textContent='LEVEL CLEAR! 🏁';
  const t=Math.round(levelT), med=medalFor(curLevel,t), old=timeStore[curLevel];
  if(old==null||t<old){ timeStore[curLevel]=t; saveTimes(); }
  const best=timeStore[curLevel];
  document.getElementById('resultSub').textContent='Nice! '+coinsGot+' / '+coins.length+' coins, '+hearts+' ❤️ left. ⏱ '+fmtT(t)+(med?' '+med:'')+' (best '+fmtT(best)+'). Up next: '+LEVELS[curLevel+1].name+'!';
  document.getElementById('againBtn').textContent='↺ Replay level';
  document.getElementById('nextBtn').style.display='';
  o.classList.remove('hidden'); }
function showVictory(){
  setTrack('finale');   // keep the celebration tune rolling
  document.getElementById('vicSub').textContent=rushMode
    ? 'BOSS RUSH CHAMPION! All '+LEVELS.length+' bosses toppled in one run with '+hearts+' ❤️ to spare!'
    : 'You conquered all '+LEVELS.length+' worlds and toppled every boss! Final run: '+coinsGot+' / '+coins.length+' 🪙 with '+hearts+' ❤️ to spare.';
  const c=document.getElementById('confetti');
  if(!c.childElementCount){
    const cols=['#ffd54a','#ff6b6b','#5fe08a','#46c8ff','#c77dff','#ff7ad1','#ffffff'];
    for(let i=0;i<70;i++){ const d=document.createElement('div'); d.className='cp';
      d.style.left=Math.random()*100+'%'; d.style.background=cols[i%cols.length];
      d.style.width=(6+Math.random()*8)+'px'; d.style.height=(10+Math.random()*8)+'px';
      d.style.animationDuration=(3+Math.random()*3)+'s'; d.style.animationDelay=(-Math.random()*6)+'s';
      c.appendChild(d); }
  }
  document.getElementById('victoryScreen').classList.remove('hidden');
}
function lose(){ setTrack(null); const o=document.getElementById('overScreen'), rt=document.getElementById('resultText'); rt.textContent='OUCH! 💥'; rt.className='big lose';
  if(rushMode){ saveRushBest(rushIdx);
    document.getElementById('resultSub').textContent='Boss Rush over — you toppled '+rushIdx+' of '+LEVELS.length+' bosses! Best streak: '+rushBest()+'.'; }
  else document.getElementById('resultSub').textContent='You collected '+coinsGot+' coins. Try again or a different power loadout!';
  document.getElementById('againBtn').textContent=rushMode?'↺ Rush again':'↺ Replay level';
  document.getElementById('nextBtn').style.display='none';
  o.classList.remove('hidden'); }

function buildMenu(){
  if(menuLevel>=LEVELS.length||menuLevel<0) menuLevel=0;
  const rb=rushBest(); document.getElementById('rushBtn').textContent='👑 BOSS RUSH'+(rb?' · Best '+rb+'/'+LEVELS.length:'');
  const lw=document.getElementById('levels'); lw.innerHTML='';
  LEVELS.forEach((lv,i)=>{ const d=document.createElement('div'); d.className='chip'+(i===menuLevel?' sel':'');
    const gn=(gemStore[i]||[]).filter(Boolean).length;
    const md=timeStore[i]!=null?medalFor(i,timeStore[i]):'';
    d.textContent=(i+1)+'· '+lv.name+(gn?' 💎'+gn:'')+(md?' '+md:'');
    d.onclick=()=>{ menuLevel=i; [...lw.children].forEach(x=>x.classList.remove('sel')); d.classList.add('sel'); saveHero(); }; lw.appendChild(d); });
  const cw=document.getElementById('colors'); cw.innerHTML='';
  COLORS.forEach(c=>{ const d=document.createElement('div'); d.className='sw'+(c===sel.color?' sel':''); d.style.background=c;
    d.onclick=()=>{ sel.color=c; [...cw.children].forEach(x=>x.classList.toggle('sel',x===d)); saveHero(); }; cw.appendChild(d); });
  const hw=document.getElementById('hats'); hw.innerHTML='';
  HATS.forEach(h=>{ const d=document.createElement('div'); const open=hatOpen(h);
    d.className='chip'+(h.id===sel.hat?' sel':''); d.style.opacity=open?'':'0.45';
    d.textContent=open ? h.ic+' '+h.nm : '🔒 '+h.ic+' '+h.nm+' — '+h.hint;
    d.onclick=()=>{ if(!hatOpen(h)) return; sel.hat=h.id; [...hw.children].forEach(x=>x.classList.remove('sel')); d.classList.add('sel'); saveHero(); }; hw.appendChild(d); });
  const aw=document.getElementById('abilities'); aw.innerHTML='';
  ABILITIES.forEach(ab=>{ const d=document.createElement('div'); d.dataset.id=ab.id;
    d.innerHTML='<span class="ic">'+ab.ic+'</span><span><span class="nm">'+ab.nm+'</span><br><span class="de">'+ab.de+'</span></span>';
    d.className='abil'+(has(ab.id)?' sel':'');
    d.onclick=()=>{ if(sel.abil.has(ab.id)) sel.abil.delete(ab.id); else { if(sel.abil.size>=BUDGET) return; sel.abil.add(ab.id); } saveHero(); refreshAbil(); };
    aw.appendChild(d); });
  refreshAbil();
}
function refreshAbil(){
  document.getElementById('budget').textContent='Points: '+sel.abil.size+' / '+BUDGET;
  document.querySelectorAll('.abil').forEach(d=>{ const id=d.dataset.id; const on=sel.abil.has(id);
    d.classList.toggle('sel',on); d.classList.toggle('dis', !on && sel.abil.size>=BUDGET); });
}
document.getElementById('playBtn').onclick=()=>startGame(menuLevel);
document.getElementById('nextBtn').onclick=()=>startGame(curLevel+1);
document.getElementById('againBtn').onclick=()=>rushMode?startRush():startGame(curLevel);
document.getElementById('rushBtn').onclick=()=>{ saveHero(); startRush(); };
document.getElementById('overMenu').onclick=toMenu;
document.getElementById('menuBtn').onclick=toMenu;
document.getElementById('vicAgain').onclick=()=>startGame(0);
document.getElementById('vicMenu').onclick=toMenu;

// audio settings UI
const musTogEl=document.getElementById('musTog'), sfxTogEl=document.getElementById('sfxTog'), musBtnEl=document.getElementById('musBtn');
function updAudioUI(){
  musTogEl.textContent='🎵 Music: '+(musicOn?'ON':'OFF'); musTogEl.classList.toggle('sel',musicOn);
  sfxTogEl.textContent='🔊 Sound FX: '+(sfxOn?'ON':'OFF'); sfxTogEl.classList.toggle('sel',sfxOn);
  musBtnEl.textContent=musicOn?'🎵':'🔇';
}
function toggleMusic(){ musicOn=!musicOn; saveAudio(); if(musicOn) runMusic(); else stopMusic(); updAudioUI(); }
musTogEl.onclick=toggleMusic; musBtnEl.onclick=toggleMusic;
sfxTogEl.onclick=()=>{ sfxOn=!sfxOn; saveAudio(); if(sfxOn) beep(660,.08,'square',.05); updAudioUI(); };
updAudioUI();
curTrack='title';   // starts on first tap/keypress (autoplay policy)

// ---------- loop ----------
let last=0;
function loop(ts){ let dt=Math.min(0.033,(ts-last)/1000)||0; last=ts;
  update(dt);
  for(let i=pops.length-1;i>=0;i--){ pops[i].t-=dt; if(pops[i].t<=0) pops.splice(i,1); }
  if(toasts) for(let i=toasts.length-1;i>=0;i--){ toasts[i].t-=dt; toasts[i].y-=28*dt; if(toasts[i].t<=0) toasts.splice(i,1); }
  if(coins) for(let i=coins.length-1;i>=0;i--){ const c=coins[i]; if(c.fall&&c.y>H*TILE+40) coins.splice(i,1); }  // rain coins lost to pits
  render(); drawHUD();
  requestAnimationFrame(loop);
}
buildLevel(menuLevel); resetPlayer(); buildMenu();   // resetPlayer() creates cam/p so the first render frame doesn't crash
document.getElementById('ver').textContent=APP_VERSION;
requestAnimationFrame(loop);
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
